<svg xmlns="http://www.w3.org/2000/svg" width="737" height="778" viewBox="0 0 737 778">
<rect width="737" height="778" rx="10" fill="#0d1117"/>
<circle cx="20" cy="18" r="6" fill="#ff5f56"/><circle cx="40" cy="18" r="6" fill="#ffbd2e"/><circle cx="60" cy="18" r="6" fill="#27c93f"/>
<text x="368.5" y="22" text-anchor="middle" fill="#c9d1d9" fill-opacity="0.6" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="13">leakproof scan</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="14" fill="#c9d1d9" xml:space="preserve">
<text y="70"><tspan x="24.0" textLength="75.6" lengthAdjust="spacingAndGlyphs" font-weight="700">LeakProof</tspan><tspan x="99.6" textLength="159.6" lengthAdjust="spacingAndGlyphs"> v0.1.0 · scanning </tspan><tspan x="259.2" textLength="193.2" lengthAdjust="spacingAndGlyphs" font-weight="700">notenest-three-and-free</tspan></text>
<text y="90"><tspan x="24.0" textLength="201.6" lengthAdjust="spacingAndGlyphs" fill-opacity="0.6">90 files checked in 0.4s</tspan></text>
<text y="110"></text>
<text y="130"><tspan x="24.0" textLength="126.0" lengthAdjust="spacingAndGlyphs" fill="#ff7b72" font-weight="700">✗ 6 leaks found</tspan><tspan x="150.0" textLength="25.2" lengthAdjust="spacingAndGlyphs"> · </tspan><tspan x="175.2" textLength="84.0" lengthAdjust="spacingAndGlyphs" fill="#ff7b72">5 critical</tspan><tspan x="259.2" textLength="25.2" lengthAdjust="spacingAndGlyphs"> · </tspan><tspan x="284.4" textLength="50.4" lengthAdjust="spacingAndGlyphs" fill="#e3b341">1 high</tspan></text>
<text y="150"></text>
<text y="170"><tspan x="24.0" textLength="672.0" lengthAdjust="spacingAndGlyphs" fill="#ff7b72" font-weight="700">── CRITICAL (5) ────────────────────────────────────────────────────────────────</tspan></text>
<text y="190"></text>
<text y="210"><tspan x="24.0" textLength="16.8" lengthAdjust="spacingAndGlyphs">  </tspan><tspan x="40.8" textLength="344.4" lengthAdjust="spacingAndGlyphs" font-weight="700">src/routes/api/public/stripe-webhook.ts:7</tspan></text>
<text y="230"><tspan x="24.0" textLength="646.8" lengthAdjust="spacingAndGlyphs">    Stripe webhook doesn't verify signatures: anyone can send a fake 'payment</tspan></text>
<text y="250"><tspan x="24.0" textLength="453.6" lengthAdjust="spacingAndGlyphs">    completed' event and unlock paid features for free</tspan></text>
<text y="270"><tspan x="24.0" textLength="33.6" lengthAdjust="spacingAndGlyphs">    </tspan><tspan x="57.6" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#ff7b72">→</tspan><tspan x="66.0" textLength="336.0" lengthAdjust="spacingAndGlyphs"> Verify the stripe-signature header with</tspan></text>
<text y="290"><tspan x="24.0" textLength="663.6" lengthAdjust="spacingAndGlyphs">      stripe.webhooks.constructEvent(rawBody, signature, STRIPE_WEBHOOK_SECRET)</tspan></text>
<text y="310"><tspan x="24.0" textLength="630.0" lengthAdjust="spacingAndGlyphs">      before trusting the event. Use the raw request body, not parsed JSON.</tspan></text>
<text y="330"></text>
<text y="350"><tspan x="24.0" textLength="16.8" lengthAdjust="spacingAndGlyphs">  </tspan><tspan x="40.8" textLength="126.0" lengthAdjust="spacingAndGlyphs" font-weight="700">src/lib/ai.ts:1</tspan></text>
<text y="370"><tspan x="24.0" textLength="386.4" lengthAdjust="spacingAndGlyphs">    OpenAI API key hardcoded: sk-proj-****W1xY</tspan></text>
<text y="390"><tspan x="24.0" textLength="33.6" lengthAdjust="spacingAndGlyphs">    </tspan><tspan x="57.6" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#ff7b72">→</tspan><tspan x="66.0" textLength="495.6" lengthAdjust="spacingAndGlyphs"> Move this key to a server-side function and rotate it now.</tspan></text>
<text y="410"></text>
<text y="430"><tspan x="24.0" textLength="16.8" lengthAdjust="spacingAndGlyphs">  </tspan><tspan x="40.8" textLength="50.4" lengthAdjust="spacingAndGlyphs" font-weight="700">.env:7</tspan></text>
<text y="450"><tspan x="24.0" textLength="495.6" lengthAdjust="spacingAndGlyphs">    STRIPE_SECRET_KEY is committed to git: sk_test_****M5wZ</tspan></text>
<text y="470"><tspan x="24.0" textLength="16.8" lengthAdjust="spacingAndGlyphs">  </tspan><tspan x="40.8" textLength="50.4" lengthAdjust="spacingAndGlyphs" font-weight="700">.env:8</tspan></text>
<text y="490"><tspan x="24.0" textLength="562.8" lengthAdjust="spacingAndGlyphs">    SUPABASE_SERVICE_ROLE_KEY is committed to git: eyJhbGci****2345</tspan></text>
<text y="510"><tspan x="24.0" textLength="16.8" lengthAdjust="spacingAndGlyphs">  </tspan><tspan x="40.8" textLength="50.4" lengthAdjust="spacingAndGlyphs" font-weight="700">.env:9</tspan></text>
<text y="530"><tspan x="24.0" textLength="621.6" lengthAdjust="spacingAndGlyphs">    VITE_STRIPE_SECRET_KEY is committed to git and shipped to the browser:</tspan></text>
<text y="550"><tspan x="24.0" textLength="168.0" lengthAdjust="spacingAndGlyphs">    sk_test_****M5wZ</tspan></text>
<text y="570"><tspan x="24.0" textLength="33.6" lengthAdjust="spacingAndGlyphs">    </tspan><tspan x="57.6" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#ff7b72">→</tspan><tspan x="66.0" textLength="613.2" lengthAdjust="spacingAndGlyphs"> Remove .env from git (git rm --cached .env), add .env to .gitignore, and</tspan></text>
<text y="590"><tspan x="24.0" textLength="562.8" lengthAdjust="spacingAndGlyphs">      rotate this key; it stays in git history even after deletion.</tspan></text>
<text y="610"></text>
<text y="630"><tspan x="24.0" textLength="672.0" lengthAdjust="spacingAndGlyphs" fill="#e3b341" font-weight="700">── HIGH (1) ────────────────────────────────────────────────────────────────────</tspan></text>
<text y="650"></text>
<text y="670"><tspan x="24.0" textLength="16.8" lengthAdjust="spacingAndGlyphs">  </tspan><tspan x="40.8" textLength="184.8" lengthAdjust="spacingAndGlyphs" font-weight="700">src/lib/payments.ts:14</tspan></text>
<text y="690"><tspan x="24.0" textLength="394.8" lengthAdjust="spacingAndGlyphs">    Secret exposed to the browser through Vite:</tspan></text>
<text y="710"><tspan x="24.0" textLength="352.8" lengthAdjust="spacingAndGlyphs">    import.meta.env.VITE_STRIPE_SECRET_KEY</tspan></text>
<text y="730"><tspan x="24.0" textLength="33.6" lengthAdjust="spacingAndGlyphs">    </tspan><tspan x="57.6" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#e3b341">→</tspan><tspan x="66.0" textLength="630.0" lengthAdjust="spacingAndGlyphs"> Vite ships every VITE_ variable to the browser: drop the VITE_ prefix, use</tspan></text>
<text y="750"><tspan x="24.0" textLength="537.6" lengthAdjust="spacingAndGlyphs">      STRIPE_SECRET_KEY only in server-side code, and rotate it.</tspan></text>
</g>
</svg>
